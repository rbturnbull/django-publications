{% load publication_extras %}
<ol>
  {% for reference in subject.references.all %}
    <li>
      {{ reference.publication.authors }}, <a href='{{ reference.publication.get_absolute_url }}'>{{ reference.publication }}</a>{% if reference.locator %}, {{ reference.locator }}{% endif %}.
    </li>
  {% endfor %}
</ol>
{% reference_add_button subject %}
